description: |
  Cycle through all GIFs registered via ZMK_OLED_GIF_DEFINE().
  Each press advances to the next registered animation.

  IMPORTANT: the keymap node name must be <= 8 characters because
  this behavior uses BEHAVIOR_LOCALITY_GLOBAL (runs on both halves).

  Example keymap usage:
    behaviors {
        gif_cyc: gif_cyc {
            compatible = "zmk,behavior-oled-gif-cycle";
            #binding-cells = <0>;
        };
    };
    // Then bind: &gif_cyc

compatible: "zmk,behavior-oled-gif-cycle"

include: zero_param.yaml

properties:
  "#binding-cells":
    type: int
    const: 0
